<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TechBridge Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 1); }
        .nav-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        .mobile-nav-active { color: #3b82f6 !important; }
        .transition-all-custom { transition: all 0.3s ease; }
        @media (hover: hover) {
            .news-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        }
        /* 모달 바텀시트 (모바일) */
        @media (max-width: 767px) {
            #keyword-modal { align-items: flex-end; }
            #keyword-modal-content-box {
                border-radius: 1.5rem 1.5rem 0 0;
                max-height: 85vh;
                display: flex;
                flex-direction: column;
            }
            #modal-news-list { flex: 1; overflow-y: auto; }
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- 상단 네비게이션 -->
    <nav class="sticky top-0 z-50 bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14 md:h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 p-1.5 md:p-2 rounded-lg">
                        <i class="fas fa-microchip text-white text-base md:text-xl"></i>
                    </div>
                    <span class="text-lg md:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">TechBridge</span>
                </div>
                <!-- 데스크탑 탭 -->
                <div class="hidden md:flex space-x-8">
                    <button onclick="showPage('home')" id="nav-home" class="nav-active px-1 py-4 text-sm font-medium transition-all-custom">홈 동향</button>
                    <button onclick="showPage('analysis')" id="nav-analysis" class="px-1 py-4 text-sm font-medium text-slate-500 transition-all-custom">데이터 분석</button>
                </div>
                <!-- 업데이트 버튼 -->
                <button onclick="updateNewsData()" id="update-btn" class="flex items-center gap-2 bg-blue-600 text-white px-3 py-2 md:px-4 rounded-full text-sm font-medium hover:bg-blue-700 active:bg-blue-800 shadow-md transition-colors">
                    <i class="fas fa-sync-alt" id="update-icon"></i>
                    <span class="hidden sm:inline">최신 동향 업데이트</span>
                </button>
            </div>
        </div>
    </nav>

    <main id="content-area" class="max-w-7xl mx-auto px-3 sm:px-4 py-5 md:py-8 pb-24 md:pb-8">
        <!-- 로딩 오버레이 -->
        <div id="loading-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] hidden flex flex-col items-center justify-center text-white">
            <div class="w-12 h-12 md:w-16 md:h-16 border-4 border-blue-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-base md:text-lg font-bold">국내외 언론 동향 스크리닝 중...</p>
            <p class="text-sm text-slate-300 mt-1">잠시만 기다려 주세요</p>
        </div>

        <!-- 홈 섹션 -->
        <div id="page-home">
            <header class="mb-6 md:mb-10">
                <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-1 md:mb-2">오늘의 기술사업화 브리핑</h1>
                <p class="text-sm md:text-base text-slate-500">실시간 기술 이전 및 상용화 소식을 모아드립니다.</p>
            </header>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-8">
                <div class="lg:col-span-2 space-y-3 md:space-y-4" id="korea-news-container"></div>
                <div class="lg:col-span-1 space-y-3 md:space-y-4" id="global-news-container"></div>
            </div>
        </div>

        <!-- 분석 섹션 -->
        <div id="page-analysis" class="hidden">
            <header class="mb-6 md:mb-10">
                <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-1 md:mb-2">트렌드 분석 대시보드</h1>
            </header>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-8">
                <div class="glass-card p-5 md:p-8 rounded-2xl h-64 md:h-80"><canvas id="keywordChart"></canvas></div>
                <div class="glass-card p-5 md:p-8 rounded-2xl">
                    <h3 class="font-bold mb-3 md:mb-4">주요 기업 이슈 <span class="text-xs font-normal text-slate-400">(클릭하여 기사 보기)</span></h3>
                    <div id="company-issues" class="space-y-1">
                        <div class="flex items-center gap-2 text-slate-400 text-sm py-2">
                            <div class="w-4 h-4 border-2 border-slate-300 border-t-transparent rounded-full animate-spin"></div>
                            기업 이슈 로딩 중...
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 md:mt-12">
                <h3 class="text-xl md:text-2xl font-bold text-slate-900 mb-4 md:mb-6 flex items-center gap-2">
                    <i class="fas fa-landmark text-slate-400"></i> 부처별 주요 정책 및 보도자료
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                    <div class="glass-card p-5 md:p-6 rounded-2xl border-t-4 border-t-blue-500 shadow-sm">
                        <h4 class="text-base md:text-lg font-bold text-slate-800 mb-3 md:mb-4">과기정통부</h4>
                        <div id="msit-news-container" class="space-y-3">
                            <p class="text-sm text-slate-400">업데이트 버튼을 눌러주세요.</p>
                        </div>
                    </div>
                    <div class="glass-card p-5 md:p-6 rounded-2xl border-t-4 border-t-indigo-500 shadow-sm">
                        <h4 class="text-base md:text-lg font-bold text-slate-800 mb-3 md:mb-4">산업통상자원부</h4>
                        <div id="motie-news-container" class="space-y-3">
                            <p class="text-sm text-slate-400">업데이트 버튼을 눌러주세요.</p>
                        </div>
                    </div>
                    <div class="glass-card p-5 md:p-6 rounded-2xl border-t-4 border-t-emerald-500 shadow-sm">
                        <h4 class="text-base md:text-lg font-bold text-slate-800 mb-3 md:mb-4">중소벤처기업부</h4>
                        <div id="mss-news-container" class="space-y-3">
                            <p class="text-sm text-slate-400">업데이트 버튼을 눌러주세요.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 키워드 모달 -->
        <div id="keyword-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[150] hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
            <div class="bg-white p-5 md:p-8 rounded-t-3xl md:rounded-3xl md:max-w-2xl w-full mx-0 md:mx-4 shadow-2xl relative transform translate-y-4 md:translate-y-0 md:scale-95 transition-transform duration-300" id="keyword-modal-content-box">
                <button onclick="closeKeywordModal()" class="absolute top-4 right-4 md:top-6 md:right-6 text-slate-400 hover:text-slate-700 transition-colors p-1">
                    <i class="fas fa-times text-xl md:text-2xl"></i>
                </button>
                <div class="flex items-center gap-3 mb-4 md:mb-6">
                    <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center">
                        <i class="fas fa-search-dollar text-sm md:text-base"></i>
                    </div>
                    <h3 id="modal-title" class="text-xl md:text-2xl font-bold text-slate-900">추천 기사</h3>
                </div>
                <div id="modal-news-list" class="space-y-3 max-h-[55vh] md:max-h-[60vh] overflow-y-auto pr-1 md:pr-2"></div>
            </div>
        </div>
    </main>

    <!-- 모바일 하단 탭 바 -->
    <div class="fixed bottom-0 left-0 right-0 z-50 md:hidden bg-white border-t border-slate-200 flex safe-bottom">
        <button onclick="showPage('home')" id="mobile-nav-home" class="flex-1 flex flex-col items-center py-3 text-blue-600 transition-colors">
            <i class="fas fa-home text-lg"></i>
            <span class="text-[11px] mt-0.5 font-medium">홈 동향</span>
        </button>
        <button onclick="updateNewsData()" class="flex-1 flex flex-col items-center py-3 text-slate-400 transition-colors">
            <i class="fas fa-sync-alt text-lg" id="mobile-update-icon"></i>
            <span class="text-[11px] mt-0.5 font-medium">업데이트</span>
        </button>
        <button onclick="showPage('analysis')" id="mobile-nav-analysis" class="flex-1 flex flex-col items-center py-3 text-slate-400 transition-colors">
            <i class="fas fa-chart-bar text-lg"></i>
            <span class="text-[11px] mt-0.5 font-medium">데이터 분석</span>
        </button>
    </div>

    <script>
        let koreaNews = [];
        let globalNews = [];
        let msitNews = [];
        let motieNews = [];
        let mssNews = [];
        let companyIssuesLoaded = false;

        const COMPANY_LIST = [
            { name: '삼성전자',       query: '삼성전자 (기술이전 OR 기술사업화 OR 특허 상용화)' },
            { name: 'SK하이닉스',     query: 'SK하이닉스 (기술이전 OR 반도체 기술사업화)' },
            { name: 'LG에너지솔루션', query: 'LG에너지솔루션 (기술이전 OR 배터리 상용화)' },
            { name: '현대자동차',     query: '현대자동차 (기술이전 OR 기술사업화)' },
            { name: 'KAIST',          query: 'KAIST (기술사업화 OR 스핀오프 OR 기술이전)' },
            { name: '포스코',         query: '포스코 (기술이전 OR 기술사업화)' },
            { name: '한화',           query: '한화 (기술이전 OR 기술사업화 OR 우주 상용화)' },
            { name: '카카오',         query: '카카오 (기술이전 OR AI 상용화 OR 기술사업화)' },
        ];

        async function updateNewsData() {
            const loadingOverlay = document.getElementById('loading-overlay');
            const updateIcon = document.getElementById('update-icon');
            const mobileIcon = document.getElementById('mobile-update-icon');

            loadingOverlay.classList.remove('hidden');
            updateIcon.classList.add('animate-spin');
            mobileIcon.classList.add('animate-spin');

            try {
                const res = await fetch('/api/news');
                if (!res.ok) throw new Error('서버 오류: ' + res.status);
                const data = await res.json();

                if (data && data.korea) {
                    koreaNews = data.korea;
                    globalNews = data.global;
                    msitNews = data.msit || [];
                    motieNews = data.motie || [];
                    mssNews = data.mss || [];
                    renderNews();
                    renderMinistryNews();
                    showToast("최신 동향 업데이트 완료!");
                }
            } catch (error) {
                showToast(error.message, "error");
            } finally {
                loadingOverlay.classList.add('hidden');
                updateIcon.classList.remove('animate-spin');
                mobileIcon.classList.remove('animate-spin');
            }
        }

        function renderNews() {
            const kContainer = document.getElementById('korea-news-container');
            const gContainer = document.getElementById('global-news-container');

            kContainer.innerHTML = `<h2 class="text-base md:text-xl font-bold mb-3 md:mb-4 flex items-center gap-2"><span class="w-1 h-5 md:h-6 bg-blue-600 rounded"></span>국내 동향 (Google News)</h2>` +
                koreaNews.map(n => `
                <div class="glass-card p-4 md:p-6 rounded-xl md:rounded-2xl news-card cursor-pointer active:bg-slate-50" onclick="window.open('${n.link}', '_blank')">
                    <span class="px-2 py-0.5 bg-blue-50 text-blue-600 text-xs font-bold rounded">${n.category || ''}</span>
                    <h3 class="text-base md:text-lg font-bold mt-2 leading-snug">${n.title}</h3>
                    <p class="text-slate-500 text-xs md:text-sm mt-1.5 line-clamp-2">${n.summary}</p>
                    <div class="mt-3 flex justify-between text-xs text-slate-400">
                        <span class="flex items-center gap-1"><i class="far fa-newspaper"></i> ${n.source}</span>
                        <span>${n.date}</span>
                    </div>
                </div>`).join('');

            gContainer.innerHTML = `<h2 class="text-base md:text-xl font-bold mb-3 md:mb-4 flex items-center gap-2"><span class="w-1 h-5 md:h-6 bg-indigo-600 rounded"></span>글로벌 동향 (Google News)</h2>
                <div class="glass-card rounded-xl md:rounded-2xl overflow-hidden">` +
                globalNews.map(n => `
                <div class="p-3 md:p-4 border-b last:border-b-0 active:bg-slate-50 cursor-pointer" onclick="window.open('${n.link}', '_blank')">
                    <span class="text-[10px] font-bold text-indigo-500 uppercase">${n.country || ''}</span>
                    <h4 class="text-sm font-bold mt-0.5 leading-snug">${n.title}</h4>
                    <p class="text-[10px] text-slate-400 mt-1">${n.source} | ${n.date}</p>
                </div>`).join('') + `</div>`;
        }

        function renderMinistryNews() {
            const generateHtml = (newsArray) => {
                if (!newsArray || newsArray.length === 0) return '<p class="text-sm text-slate-400">데이터가 없습니다.</p>';
                return newsArray.map(n => `
                    <div class="p-3 bg-slate-50 active:bg-slate-100 rounded-xl transition-colors cursor-pointer" onclick="window.open('${n.link}', '_blank')">
                        <h5 class="text-sm font-bold text-slate-800 line-clamp-2">${n.title}</h5>
                        <div class="mt-1.5 text-[10px] text-slate-500 flex justify-between">
                            <span>${n.source}</span><span>${n.date}</span>
                        </div>
                    </div>
                `).join('');
            };
            document.getElementById('msit-news-container').innerHTML = generateHtml(msitNews);
            document.getElementById('motie-news-container').innerHTML = generateHtml(motieNews);
            document.getElementById('mss-news-container').innerHTML = generateHtml(mssNews);
        }

        function renderArticleList(listEl, articles) {
            if (articles && articles.length > 0) {
                listEl.innerHTML = articles.map(n => `
                    <div class="p-3 md:p-4 border border-slate-100 rounded-xl active:border-blue-300 cursor-pointer" onclick="window.open('${n.link}', '_blank')">
                        <h4 class="text-sm font-bold text-slate-800 leading-snug">${n.title}</h4>
                        <div class="mt-1.5 flex items-center gap-2 text-xs text-slate-500">
                            <span class="bg-slate-100 px-2 py-0.5 rounded">${n.source}</span>
                            <span>${n.date}</span>
                        </div>
                    </div>`).join('');
            } else {
                listEl.innerHTML = '<p class="text-center text-slate-500 py-8">관련 기사를 찾을 수 없습니다.</p>';
            }
        }

        async function openKeywordModal(keyword, prefetchedArticles = null) {
            const modal = document.getElementById('keyword-modal');
            const contentBox = document.getElementById('keyword-modal-content-box');
            const titleEl = document.getElementById('modal-title');
            const listEl = document.getElementById('modal-news-list');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                contentBox.classList.remove('translate-y-4', 'scale-95');
            }, 10);

            titleEl.innerText = `'${keyword}' 관련 기사`;

            if (prefetchedArticles) {
                renderArticleList(listEl, prefetchedArticles);
                return;
            }

            listEl.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10">
                    <div class="w-9 h-9 border-4 border-blue-400 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-slate-500 text-sm">기사를 가져오는 중...</p>
                </div>`;

            try {
                const query = `"${keyword}" (기술사업화 OR 기술이전 OR 상용화)`;
                const res = await fetch(`/api/keyword?q=${encodeURIComponent(query)}`);
                renderArticleList(listEl, await res.json());
            } catch {
                listEl.innerHTML = '<p class="text-center text-slate-500 py-8">기사를 불러오는 중 오류가 발생했습니다.</p>';
            }
        }

        async function loadCompanyIssues() {
            if (companyIssuesLoaded) return;
            companyIssuesLoaded = true;

            const container = document.getElementById('company-issues');

            const results = await Promise.allSettled(
                COMPANY_LIST.map(async (company) => {
                    const res = await fetch(`/api/keyword?q=${encodeURIComponent(company.query)}`);
                    const articles = await res.json();
                    return { ...company, articles };
                })
            );

            const withArticles = results
                .filter(r => r.status === 'fulfilled' && r.value.articles?.length > 0)
                .map(r => r.value);

            if (withArticles.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400">현재 관련 기사가 없습니다.</p>';
                return;
            }

            container.innerHTML = withArticles.map(c => `
                <div class="flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-blue-50 active:bg-blue-50 cursor-pointer transition-colors group"
                     onclick="openKeywordModal('${c.name}', companyArticleCache['${c.name}'])">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-400 flex-shrink-0"></span>
                        <span class="text-sm font-medium text-slate-700 group-hover:text-blue-600 transition-colors">${c.name}</span>
                    </div>
                    <span class="text-xs text-slate-400 group-hover:text-blue-500 flex items-center gap-1">
                        기사 ${c.articles.length}건 <i class="fas fa-chevron-right text-[9px]"></i>
                    </span>
                </div>`).join('');

            // 사전 조회 결과 캐시
            window.companyArticleCache = Object.fromEntries(
                withArticles.map(c => [c.name, c.articles])
            );
        }

        function closeKeywordModal() {
            const modal = document.getElementById('keyword-modal');
            const contentBox = document.getElementById('keyword-modal-content-box');
            modal.classList.add('opacity-0');
            contentBox.classList.add('translate-y-4', 'scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // 모달 배경 클릭 시 닫기
        document.getElementById('keyword-modal').addEventListener('click', function(e) {
            if (e.target === this) closeKeywordModal();
        });

        function showPage(page) {
            document.getElementById('page-home').classList.toggle('hidden', page !== 'home');
            document.getElementById('page-analysis').classList.toggle('hidden', page !== 'analysis');

            // 데스크탑 탭
            document.getElementById('nav-home').classList.toggle('nav-active', page === 'home');
            document.getElementById('nav-home').classList.toggle('text-slate-500', page !== 'home');
            document.getElementById('nav-analysis').classList.toggle('nav-active', page === 'analysis');
            document.getElementById('nav-analysis').classList.toggle('text-slate-500', page !== 'analysis');

            // 모바일 탭
            document.getElementById('mobile-nav-home').classList.toggle('mobile-nav-active', page === 'home');
            document.getElementById('mobile-nav-home').classList.toggle('text-slate-400', page !== 'home');
            document.getElementById('mobile-nav-analysis').classList.toggle('mobile-nav-active', page === 'analysis');
            document.getElementById('mobile-nav-analysis').classList.toggle('text-slate-400', page !== 'analysis');

            if (page === 'analysis') {
                initChart();
                loadCompanyIssues();
            }
        }

        function initChart() {
            const ctx = document.getElementById('keywordChart').getContext('2d');
            if (window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['인공지능', '반도체', '이차전지', '양자', '수소'],
                    datasets: [{
                        label: '언급빈도',
                        data: [95, 82, 70, 40, 30],
                        backgroundColor: '#3b82f6',
                        borderRadius: 5,
                        hoverBackgroundColor: '#2563eb'
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    onHover: (event, chartElement) => {
                        event.native.target.style.cursor = chartElement[0] ? 'pointer' : 'default';
                    },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const keyword = window.myChart.data.labels[elements[0].index];
                            openKeywordModal(keyword);
                        }
                    }
                }
            });
        }

        function showToast(msg, type = "success") {
            const t = document.createElement('div');
            t.className = `fixed bottom-20 md:bottom-8 left-1/2 -translate-x-1/2 md:left-auto md:translate-x-0 md:right-8 px-5 py-3 rounded-xl text-white text-sm z-[200] shadow-lg ${type === 'success' ? 'bg-emerald-500' : 'bg-red-500'}`;
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // 페이지 열리면 자동으로 뉴스 로드
        window.onload = updateNewsData;
    </script>
</body>
</html>
